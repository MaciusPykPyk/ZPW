<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zdarzenie click</title>
     <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>

     <script>

    $(function() {
$("#naKoniec").click(function () {
    let value = $("#produkt").val()
    if (value.length > 0) {
        $("ul").append("<li>" + value + "</li>")
        $("li").last().css({
            "color":"blue","font-weight":"bold"
        });
$("input").val("");
    }

})


$("#naPoczatek").click(function () {
    let value = $("#produkt").val()
    if (value.length > 0) {
        $("ul").prepend("<li>" + value + "</li>")
          $("li").first().css({
            "color":"green","font-weight":"bold"
            
        });
        $("input").val("");
    }

})
$("#accept").change(function () {
    if (this.checked) {
        $("#send").removeAttr('disabled')
    } else{
        $("#send").attr('disabled','diabled')
    }
})})
  </script>
   
  <style>
   
  </style>
</head>
<body>
 <ul id="lista">
  <li>Chleb</li>
  <li>Mleko</li>
</ul>
<input type="text" id="produkt" placeholder="Nazwa produktu">
<button id="naKoniec">Dodaj na koniec</button>
<button id="naPoczatek">Dodaj na początek</button>
<input type="checkbox"  id="accept">
<label for="accept">Czy akceptujesz</label>
<button id="send" disabled>Wyśli</button>
  
</body>
</html>
